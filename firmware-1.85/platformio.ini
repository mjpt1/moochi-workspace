; ESP32-S3-Touch-LCD-1.85C  (Waveshare)
; ESP32-S3R8 · 16MB Flash · 8MB PSRAM (اکتال)

[env:esp32-s3-lcd-185]

; ---- پلتفرم: pioarduino ----
; پلتفرم رسمي PlatformIO فقط تا Arduino core 2.x مي‌رود.
; درايور Waveshare به esp_lcd نسخه IDF 5 نياز دارد (فيلد rgb_ele_order)
; که فقط در Arduino core 3.x هست. pioarduino همان فورک جامعه است
; که core 3.x را مي‌دهد.
;
; نسخه 55.03.311 = Arduino 3.3.11 روي ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

board = esp32-s3-devkitc-1
framework = arduino

; ---- فلش و PSRAM ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type  = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    ; برد پورت USB مستقيم به خود ESP32-S3 دارد، نه چيپ مبدل جدا.
    ; بدون اين‌ها Serial Monitor خالي مي‌ماند.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; ---- پورت ----
; تشخيص خودکار PlatformIO اين برد را برنمي‌دارد و مي‌گويد
;   Error: Please specify `upload_port`
; چون USB مستقيم به خود ESP32-S3 است (VID:PID = 303A:1001)
; نه چيپ مبدل CH340/CP210x که PlatformIO مي‌شناسد.
; پس صريح مي‌نويسيمش.
;
; اگر روزي پورت عوض شد ، اين‌طور پيدايش کن:
;   & "C:\Users\mjpt1\.platformio\penv\Scripts\platformio.exe" device list
upload_port  = COM4
monitor_port = COM4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ---- کتابخانه‌ها ----
; فعلا هيچ. درايور Waveshare مستقيم در src/ مي‌آيد.
; Arduino_GFX عمدا حذف شد — با اين پنل کار نکرد.
