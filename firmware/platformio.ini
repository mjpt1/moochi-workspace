[env:esp32dev]
; ۱۱ آبان: پلتفرم قفل شد. کد از ESP_I2S استفاده می‌کند که فقط در Arduino core 3.x هست.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; ---- حافظه‌ي برنامه ----
; گیف شروع (src/boot_gif.h) حدود ۱٫۷ مگابایت است و در فضای پیش‌فرض
; برنامه (۱٫۳ مگ) جا نمی‌شود. huge_app = حدود ۳ مگ برای برنامه.
; (هزینه: آپدیت بی‌سیم OTA غیرفعال می‌شود — فعلا لازم نداریم.)
; این فایل جزو خود هسته‌ي Arduino-ESP32 است.
board_build.partitions = huge_app.csv

; کتابخانه‌ي نمایشگر (از test 04 — نمایشگر ۱٫۶۹ اینچ ST7789V2)
; PlatformIO بار اول خودش دانلودشان می‌کند (اینترنت لازم است).
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A
    pololu/VL53L0X

; ---- کدام نمایشگر؟ (۱۲ مهر) ----
; DISPLAY_ROUND: 1 = گرد ۱٫۲۸ اینچ GC9A01 (۲۴۰×۲۴۰) ؛ 0 = مستطیل ۱٫۶۹ اینچ ST7789 (۲۴۰×۲۸۰)
; ST7789_NO_CS: 1 = پایه‌ي CS نمایشگر ۱٫۶۹ به ریل − و RES به ریل + (G27 و G25 برای صدا آزاد می‌شوند)
;               0 = سیم‌کشی قدیمی (CS→G27 ، RES→G25) و صدا خاموش
; ۱۹ مهر: مهسن نمایشگر ۱٫۶۹ را برای ربات انتخاب کرد.
; ۱۱ آبان: ST7789_CS15 = نمایشگر ۱٫۶۹ با CS روی G15 و RES به 3V3 (پیشنهاد بازبینی ، هنوز روی برد تست نشده)
build_flags = -DDISPLAY_ROUND=0 -DST7789_CS15=1

; ---- پورت ----
; قبلا COM3 ثابت بود. ۳ مهر ۱۴۰۵ آپلود گفت «COM3 وجود ندارد» —
; ویندوز شماره‌ي پورت را عوض کرده بود.
; این برد چیپ مبدل CP2102 دارد و PlatformIO آن را خودش پیدا می‌کند
; (برخلاف برد Waveshare که USB مستقیم داشت و باید دستی می‌نوشتیم).
; پس شماره‌ي ثابت برداشته شد.
;
; ⚠️ اگر ویندوز برد را اصلا ندید (device list خالی) ، اول کابل را عوض کن —
;    ۳ مهر علتش کابل بدون سیم داده بود.
;
; اگر روزی دو برد همزمان وصل بود و اشتباهی را برداشت ، این را بزن:
;   & "C:\Users\mjpt1\.platformio\penv\Scripts\platformio.exe" device list
; و شماره‌ي درست را این‌جا بنویس:
;   upload_port  = COMx
;   monitor_port = COMx
monitor_speed = 115200
